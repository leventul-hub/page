<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Leventul — швейная студия в Ташкенте. Пошив одежды, мерча и униформы для бизнеса и брендов.">
  <title>LEVENTUL — Швейная студия</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="container header">
  <div class="logo-wrap">
    <img src="logo.png" class="logo-icon" alt="Leventul Logo">
    <div class="logo-text">LEVENTUL</div>
  </div>

  <nav class="lang-switch" aria-label="Выбор языка" data-i18n-aria-label="language_selector">
    <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="uz" aria-pressed="false">UZ</button>
  </nav>
</header>

<main>

<section class="hero container">
  <h1 data-i18n="hero_title"></h1>
  <p data-i18n="hero_text"></p>
</section>

<section class="section container about">
  <div class="about-line"></div>
  <h2 data-i18n="about_title"></h2>

  <div class="about-text">
    <p data-i18n="about_intro"></p>
    <p data-i18n="about_task_intro"></p>
    <ul class="about-list">
      <li data-i18n="about_task_1"></li>
      <li data-i18n="about_task_2"></li>
      <li data-i18n="about_task_3"></li>
      <li data-i18n="about_task_4"></li>
    </ul>
    <p data-i18n="about_summary"></p>
  </div>
</section>

<section class="section container services">
  <h2 data-i18n="production_title"></h2>

  <div class="services-grid">
    <div>
      <span class="service-number">01</span>
      <h3 data-i18n="card1_title"></h3>
    </div>

    <div>
      <span class="service-number">02</span>
      <h3 data-i18n="card2_title"></h3>
    </div>

    <div>
      <span class="service-number">03</span>
      <h3 data-i18n="card3_title"></h3>
    </div>

    <div>
      <span class="service-number">04</span>
      <h3 data-i18n="card4_title"></h3>
    </div>
    <div>
      <span class="service-number">05</span>
      <h3 data-i18n="card5_title"></h3>
    </div>
  </div>
</section>

<section class="section container gallery-section" id="merch">
  <div class="gallery-header">
    <h2 data-i18n="merch_gallery_title"></h2>
    <p data-i18n="merch_gallery_text"></p>
  </div>

  <div class="gallery-grid gallery-grid--merch">
    <figure class="gallery-card gallery-card--wide">
      <div class="gallery-media gallery-media--merch-1">
        <img class="gallery-image" src="images/gallery/merch-tshirts-long-sleeves.webp" width="1440" height="900" loading="lazy" decoding="async" data-i18n-alt="merch_card_1_alt" alt="">
        <span class="gallery-index" aria-hidden="true">01</span>
      </div>
      <figcaption>
        <span data-i18n="merch_card_1_label"></span>
        <h3 data-i18n="merch_card_1_title"></h3>
      </figcaption>
    </figure>

    <figure class="gallery-card gallery-card--narrow">
      <div class="gallery-media gallery-media--merch-2">
        <img class="gallery-image" src="images/gallery/merch-hoodies-sweatshirts.webp" width="960" height="1200" loading="lazy" decoding="async" data-i18n-alt="merch_card_2_alt" alt="">
        <span class="gallery-index" aria-hidden="true">02</span>
      </div>
      <figcaption>
        <span data-i18n="merch_card_2_label"></span>
        <h3 data-i18n="merch_card_2_title"></h3>
      </figcaption>
    </figure>

    <figure class="gallery-card gallery-card--narrow">
      <div class="gallery-media gallery-media--merch-3">
        <img class="gallery-image" src="images/gallery/merch-accessories.webp" width="960" height="1200" loading="lazy" decoding="async" data-i18n-alt="merch_card_3_alt" alt="">
        <span class="gallery-index" aria-hidden="true">03</span>
      </div>
      <figcaption>
        <span data-i18n="merch_card_3_label"></span>
        <h3 data-i18n="merch_card_3_title"></h3>
      </figcaption>
    </figure>

    <figure class="gallery-card gallery-card--wide">
      <div class="gallery-media gallery-media--merch-4">
        <img class="gallery-image" src="images/gallery/merch-corporate-set.webp" width="1440" height="900" loading="lazy" decoding="async" data-i18n-alt="merch_card_4_alt" alt="">
        <span class="gallery-index" aria-hidden="true">04</span>
      </div>
      <figcaption>
        <span data-i18n="merch_card_4_label"></span>
        <h3 data-i18n="merch_card_4_title"></h3>
      </figcaption>
    </figure>
  </div>
</section>

<section class="section container gallery-section" id="collections">
  <div class="gallery-header">
    <h2 data-i18n="collections_gallery_title"></h2>
    <p data-i18n="collections_gallery_text"></p>

  <div class="gallery-grid gallery-grid--collections">
    <figure class="gallery-card gallery-card--collection-main">
      <div class="gallery-media gallery-media--collection-1">
        <img class="gallery-image" src="images/gallery/collection-capsule.webp" width="1600" height="700" loading="lazy" decoding="async" data-i18n-alt="collection_card_1_alt" alt="">
        <span class="gallery-index" aria-hidden="true">01</span>
      </div>
      <figcaption>
        <span data-i18n="collection_card_1_label"></span>
        <h3 data-i18n="collection_card_1_title"></h3>
      </figcaption>
    </figure>

    <figure class="gallery-card gallery-card--collection-side">
      <div class="gallery-media gallery-media--collection-2">
        <img class="gallery-image" src="images/gallery/collection-author.webp" width="1200" height="900" loading="lazy" decoding="async" data-i18n-alt="collection_card_2_alt" alt="">
        <span class="gallery-index" aria-hidden="true">02</span>
      </div>
      <figcaption>
        <span data-i18n="collection_card_2_label"></span>
        <h3 data-i18n="collection_card_2_title"></h3>
      </figcaption>
    </figure>

    <figure class="gallery-card gallery-card--collection-side">
      <div class="gallery-media gallery-media--collection-3">
        <img class="gallery-image" src="images/gallery/collection-seasonal.webp" width="1200" height="900" loading="lazy" decoding="async" data-i18n-alt="collection_card_3_alt" alt="">
        <span class="gallery-index" aria-hidden="true">03</span>
      </div>
      <figcaption>
        <span data-i18n="collection_card_3_label"></span>
        <h3 data-i18n="collection_card_3_title"></h3>
      </figcaption>
    </figure>
  </div>
</section>

<section class="section container contact">
  <h2 data-i18n="contact_title"></h2>

  <div class="contact-content">
    <p>
      <strong data-i18n="phone_label"></strong>
      <a href="tel:+998950051825">+998 95 005 18 25</a>
    </p>
    <p>Email: <a href="mailto:info@leventul.uz">info@leventul.uz</a></p>
    <p>
      Instagram:
      <a href="https://instagram.com/leventul" target="_blank" rel="noopener">
        @leventul
      </a>
    </p>
  </div>

</section>

<footer>
  © 1988–2026 LEVENTUL — Production Studio
